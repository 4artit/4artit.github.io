{%- comment -%}
  사용법:
    include youtube.html id="VIDEO_ID" title="설명" caption="캡션" start=30
  - id: 유튜브 영상 ID (watch?v= 뒤의 값, 또는 Shorts URL의 마지막 부분)
  - vertical=true: 세로(쇼츠) 영상일 때
{%- endcomment -%}
<figure class="video{% if include.vertical %} video--vertical{% endif %}">
  <div class="video-frame">
    <iframe
      src="https://www.youtube-nocookie.com/embed/{{ include.id }}?rel=0{% if include.start %}&start={{ include.start }}{% endif %}"
      title="{{ include.title | default: 'YouTube video' | escape }}"
      loading="lazy"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
