{%- comment -%} 카드 그리드. 파라미터: posts, limit(선택) {%- endcomment -%}
{% assign lim = include.limit | default: 1000 %}
{% if include.posts.size > 0 %}
<div class="card-grid">
  {% for post in include.posts limit: lim %}
    {% include post-card.html post=post %}
  {% endfor %}
</div>
{% else %}
<p class="empty mono">// 아직 글이 없어요.</p>
{% endif %}
