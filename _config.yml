# ── 사이트 기본 정보 ─────────────────────────────
title: ARTITO
description: 개인 프로젝트와 커리어 이야기를 적는 블로그
author: ARTITO
lang: ko
url: "https://4artit.github.io"
baseurl: ""

# 소셜 링크 (비워두면 표시 안 됨)
social:
  github: 4artit
  youtube: ""        # 예: "@yourchannel"
  linkedin: ""       # 예: "your-id"
  email: ""

# ── 랜딩 페이지 ──────────────────────────────────
hero:
  eyebrow: "projects · mocap · career"
  title: "Hi, I'm ARTITO."
  intro: >-
    만들고, 찍고, 기록합니다.
    요즘은 직접 만든 모션캡처 툴로 이것저것 찍어보면서
    개발하며 배운 것과 일하면서 생각한 것들을 적고 있어요.

# 랜딩의 "Now" 섹션 — 요즘 하고 있는 것
now:
  - label: Building
    text: 개인 모션캡처 툴
  - label: Recording
    text: 모캡 테스트 영상 시리즈
  - label: Writing
    text: 커리어 회고

# ── 내비게이션 ───────────────────────────────────
nav:
  - title: Projects
    url: /projects/
  - title: Career
    url: /career/
  - title: Archive
    url: /archive/
  - title: About
    url: /about/

# ── 빌드 설정 (GitHub Pages 기본 Jekyll) ──────────
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /:year/:month/:title/
timezone: Asia/Seoul

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
