---
layout: default
---
<article class="page">
  <header class="page-header">
    <p class="eyebrow mono">// {{ page.title | downcase }}</p>
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="content">
    {{ content }}
  </div>
</article>
